name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Compilar Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Inspeccionar firmas de Firestack
        if: always()
        run: |
          AAR=$(find "$HOME/.gradle" "${GRADLE_USER_HOME:-$HOME/.gradle}" -name "*firestack*.aar" 2>/dev/null | head -n 1)
          echo "AAR=$AAR"
          if [ -z "$AAR" ]; then
            echo "No se encontró el AAR en caché. Revisa el paso Compilar Debug APK."
            exit 0
          fi
          unzip -p "$AAR" classes.jar > /tmp/fs.jar
          CLASSES=$(jar tf /tmp/fs.jar | grep '\.class$' | grep -v '\$' | sed 's/\.class$//;s/\//./g' | grep -E 'Bridge|Listener|Controller|Intra|Tunnel|Mark|Flow|Backend')
          javap -cp /tmp/fs.jar $CLASSES

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: FirewallDNS-APK
          path: app/build/outputs/apk/debug/app-debug.apk
